<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Heartless Research</title>
<style>
:root{
  --page:#f9f9f7;--surface:#fcfcfb;--ink:#0b0b0b;--ink2:#52514e;--muted:#898781;--grid:#e1e0d9;--axis:#c3c2b7;
  --s1:#2a78d6;--s2:#eb6834;--good:#006300;--bad:#d03b3b;--warn:#a87400;--chip:#efeee9;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --page:#0d0d0d;--surface:#1a1a19;--ink:#fff;--ink2:#c3c2b7;--muted:#898781;--grid:#2c2c2a;--axis:#383835;
    --s1:#3987e5;--s2:#d95926;--good:#0ca30c;--bad:#e66767;--warn:#fab219;--chip:#242423;
  }
}
:root[data-theme="dark"]{
  --page:#0d0d0d;--surface:#1a1a19;--ink:#fff;--ink2:#c3c2b7;--muted:#898781;--grid:#2c2c2a;--axis:#383835;
  --s1:#3987e5;--s2:#d95926;--good:#0ca30c;--bad:#e66767;--warn:#fab219;--chip:#242423;
}
*{box-sizing:border-box}
body{margin:0;background:var(--page);color:var(--ink);font:14px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans KR",sans-serif;padding:16px;max-width:1280px;margin-inline:auto}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-bottom:16px}
h1{font-size:20px;margin:0}
h2{font-size:13px;margin:0 0 10px;color:var(--ink2);font-weight:600;text-transform:uppercase;letter-spacing:.6px}
h3{font-size:13px;margin:14px 0 6px;color:var(--ink2);font-weight:600}
a{color:var(--s1)}
.card{background:var(--surface);border:1px solid var(--grid);border-radius:12px;padding:14px 16px;margin-bottom:12px;min-width:0}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.grid .card{margin-bottom:0}
.badge{display:inline-block;padding:2px 9px;border-radius:999px;font-weight:600;font-size:12px;border:1px solid var(--axis);color:var(--ink2);white-space:nowrap}
.on{color:var(--good);border-color:var(--good)}.off{color:var(--muted)}.warn{color:var(--warn);border-color:var(--warn)}.bad{color:var(--bad);border-color:var(--bad)}
.pos{color:var(--good)}.neg{color:var(--bad)}.muted{color:var(--muted)}.small{font-size:12px}
.wrap{overflow-x:auto}
.wrap table{min-width:860px}
td:first-child code{white-space:nowrap;overflow-wrap:normal}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th{text-align:left;color:var(--muted);font-weight:500;font-size:12px;padding:6px;border-bottom:1px solid var(--grid);white-space:nowrap}
td{padding:6px;border-bottom:1px solid var(--grid);vertical-align:top}
tr:last-child td{border-bottom:0}
td.note{max-width:460px;color:var(--ink2);font-size:12px;overflow-wrap:anywhere}
code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;color:var(--ink2);overflow-wrap:anywhere}
.chip{display:inline-block;background:var(--chip);border-radius:6px;padding:1px 6px;margin:1px 2px 1px 0;font-size:12px}
.chip.done{color:var(--muted);text-decoration:line-through}.chip.next{outline:1px solid var(--s1)}
ul.plain{margin:0;padding-left:18px}
.headline{font-weight:600}
svg.eq{width:100%;height:auto;display:block}
svg.eq text{fill:var(--ink2);font-size:11px}
svg.eq .g{stroke:var(--grid);stroke-width:1}
svg.eq .ax{stroke:var(--axis);stroke-width:1}
svg.eq .base{stroke:var(--muted);stroke-width:1;stroke-dasharray:3 4}
svg.eq .line{fill:none;stroke:var(--s1);stroke-width:2;stroke-linejoin:round}
svg.eq .dot{fill:var(--s1);stroke:var(--surface);stroke-width:2}
.kpis{display:flex;flex-wrap:wrap;gap:18px;margin-top:8px}
.kpis div b{display:block;font-size:18px;font-variant-numeric:tabular-nums}
.kpis div span{color:var(--muted);font-size:12px}
@media (max-width:720px){td.note{max-width:240px}}
</style>
</head>
<body>
<!--BODY-->
</body>
</html>
